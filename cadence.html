<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadence — Typing Coach</title>
  <meta name="description" content="Personalized typing coach with digraph-level cadence analysis" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0c0c0c;
      --surface: #131315;
      --surface2: #1a1a1e;
      --panel-bg: #101012;
      --glass: rgba(255,255,255,0.025);
      --border: rgba(255,255,255,0.055);
      --border2: rgba(255,255,255,0.10);
      --text: #d8d8d8;
      --text2: #6b7280;
      --text3: #383c44;
      --wpm-color: #4a5a6e;
      --green: #1D9E75;
      --green-dim: rgba(29,158,117,0.35);
      --green-glow: rgba(29,158,117,0.08);
      --red: #E85353;
      --red-dim: rgba(232,83,83,0.25);
      --amber: #D4973B;
      --amber-dim: rgba(212,151,59,0.20);
      --purple: #AFA9EC;
      --green-light: #5DCAA5;
      --radius: 8px;
      --font: 'SF Mono', 'Fira Code', 'Fira Mono', 'Cascadia Code', 'JetBrains Mono', monospace;
    }

    html, body { height: 100%; overflow: hidden; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
    }

    /* ─── Layout ─── */
    .app {
      display: grid;
      grid-template-columns: 320px 1fr 300px;
      height: 100vh;
      overflow: hidden;
    }

    /* ─── AI Console (Left) ─── */
    .ai-panel {
      background: var(--bg2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 16px;
      overflow-y: auto;
    }
    .ai-header {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text3);
      margin-bottom: 20px;
    }

    /* Typist Identity */
    .identity-card {
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .identity-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--text2);
      font-style: italic;
    }

    /* ─── Typing Panel (Center) ─── */
    .typing-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem 3rem;
      position: relative;
      overflow: hidden;
    }

    .typing-header {
      position: absolute;
      top: 1.5rem;
      left: 2rem;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .title {
      font-weight: bold;
      font-size: 16px;
      letter-spacing: 2px;
      color: var(--text);
    }

    .primary-mode {
      background: var(--text1);
      color: var(--bg);
      border: none;
      font-weight: bold;
    }
    .primary-mode:hover {
      background: var(--text2);
    }

    .mode-toggle {
      font-family: var(--font);
      font-size: 9px;
      letter-spacing: 0.06em;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: none;
      color: var(--text3);
      cursor: pointer;
      transition: all 0.15s;
      text-transform: uppercase;
    }
    .mode-toggle:hover { color: var(--text2); border-color: var(--border2); }
    .mode-toggle.active {
      color: var(--purple);
      background: rgba(175,169,236,0.1);
      border-color: rgba(175,169,236,0.25);
    }

    .typing-content {
      width: 100%;
      max-width: 640px;
    }

    .wpm-display {
      font-size: 38px;
      font-weight: 300;
      color: var(--wpm-color);
      margin-bottom: 1.2rem;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      opacity: 0.85;
      transition: opacity 0.3s;
      min-height: 42px;
    }

    .text-display {
      font-size: 20px;
      line-height: 1.85;
      letter-spacing: 0.01em;
      min-height: 120px;
      cursor: text;
      user-select: none;
      position: relative;
    }

    .text-display .char { transition: color 0.08s; }
    .text-display .char-correct { color: var(--green-dim); }
    .text-display .char-error { color: var(--red); }
    .text-display .char-current {
      color: var(--text);
      border-bottom: 2px solid var(--green);
      padding-bottom: 1px;
    }
    .text-display .char-pending { color: var(--text3); }
    .text-display .char-chunk-zone {
      color: var(--text2);
      background: rgba(175,169,236,0.06);
      border-radius: 2px;
    }

    .chunk-nudge {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 12px;
      color: var(--amber);
      background: rgba(212,151,59,0.12);
      border: 1px solid rgba(212,151,59,0.2);
      padding: 8px 16px;
      border-radius: 8px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 8;
      letter-spacing: 0.04em;
    }
    .chunk-nudge.visible { opacity: 1; }

    .loading-indicator {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      color: var(--text3);
      letter-spacing: 0.06em;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 6;
    }
    .loading-indicator.visible { opacity: 1; }
    .loading-indicator::after {
      content: '';
      display: inline-block;
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--purple);
      margin-left: 6px;
      animation: pulse 1s ease infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-2px); }
      75% { transform: translateX(2px); }
    }
    .text-display .char-shake {
      animation: shake 0.15s ease;
      color: var(--red);
    }

    .text-attribution {
      font-size: 12px;
      color: var(--text3);
      margin-top: 1.2rem;
      font-style: italic;
      min-height: 18px;
    }

    .focus-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: var(--text2);
      letter-spacing: 0.06em;
      background: rgba(12,12,12,0.7);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      z-index: 10;
    }
    .focus-overlay.visible { opacity: 1; pointer-events: auto; }

    #hidden-input {
      position: absolute;
      left: -9999px;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .session-flash {
      position: absolute;
      inset: 0;
      background: var(--green-glow);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s;
      z-index: 5;
    }
    .session-flash.active { opacity: 1; }

    /* ─── Right: Metrics Panel ─── */
    .metrics-panel {
      background: var(--panel-bg);
      border-left: 1px solid var(--border);
      padding: 1.2rem 1rem 1.5rem;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border2) transparent;
    }

    .metrics-header {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.16em;
      color: var(--text3);
      margin-bottom: 1rem;
    }

    .stat-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 1.2rem;
    }

    .stat-card {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
    }

    .stat-label {
      display: block;
      font-size: 9px;
      font-weight: 500;
      color: var(--text3);
      letter-spacing: 0.08em;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
    }

    .stat-unit { font-size: 10px; color: var(--text3); font-weight: 400; }

    .section { margin-bottom: 1.2rem; }
    .section-label {
      font-size: 9px;
      font-weight: 600;
      color: var(--text3);
      letter-spacing: 0.10em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    /* WPM chart */
    .wpm-chart-wrap { height: 50px; }
    .wpm-chart-wrap canvas { width: 100%; height: 50px; display: block; }

    /* Per-key timing */
    .legend { display: flex; gap: 12px; margin-bottom: 0.4rem; }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--text3); }
    .legend-dot { width: 8px; height: 8px; border-radius: 2px; }

    .vis-row {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 56px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .vis-row::-webkit-scrollbar { display: none; }

    .bar-group { display: flex; flex-direction: column; align-items: center; gap: 1px; flex-shrink: 0; }
    .bar { width: 12px; border-radius: 2px 2px 0 0; min-height: 1px; }
    .bar-dwell { background: var(--green-light); }
    .bar-flight { background: var(--purple); }
    .bar-key { font-size: 8px; color: var(--text3); margin-top: 1px; }

    /* Weak digraphs */
    .weak-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
      cursor: pointer;
      padding: 3px 4px;
      border-radius: 4px;
      transition: background 0.15s;
    }
    .weak-item:hover {
      background: rgba(255,255,255,0.03);
    }
    .weak-item:hover .weak-label {
      text-decoration: underline;
      text-underline-offset: 2px;
      color: var(--text);
    }
    .weak-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text2);
      width: 28px;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
      transition: color 0.15s;
    }
    .weak-bar-bg {
      flex: 1;
      height: 5px;
      background: var(--surface2);
      border-radius: 3px;
      overflow: hidden;
    }
    .weak-bar-fill {
      height: 100%;
      border-radius: 3px;
      background: var(--red);
      transition: width 0.4s ease;
    }
    .weak-val {
      font-size: 10px;
      color: var(--text3);
      width: 36px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .weak-hint {
      font-size: 9px;
      color: var(--text3);
      opacity: 0.5;
      margin-top: 2px;
      font-style: italic;
    }

    /* Heatmap */
    .heatmap-container {
      position: relative;
    }
    .heatmap-grid {
      display: grid;
      grid-template-columns: 14px repeat(26, 8px);
      grid-template-rows: 14px repeat(26, 8px);
      gap: 1px;
    }
    .hm-header {
      font-size: 7px;
      color: var(--text3);
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .hm-cell {
      width: 8px;
      height: 8px;
      border-radius: 1px;
      background: var(--surface2);
      transition: background-color 0.3s;
      cursor: crosshair;
    }
    .hm-corner { /* top-left empty cell */ }

    .hm-tooltip {
      position: absolute;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 11px;
      color: var(--text2);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      z-index: 20;
      white-space: nowrap;
    }
    .hm-tooltip.visible { opacity: 1; }
    .hm-tooltip strong { color: var(--text); }

    /* Settings */
    .settings-section { margin-top: auto; padding-top: 0.8rem; border-top: 1px solid var(--border); }
    .settings-toggle {
      font-family: var(--font);
      font-size: 11px;
      color: var(--text3);
      background: none;
      border: none;
      cursor: pointer;
      letter-spacing: 0.04em;
      padding: 4px 0;
      transition: color 0.15s;
    }
    .settings-toggle:hover { color: var(--text2); }

    .settings-body {
      margin-top: 0.6rem;
      display: block;
    }

    .settings-body label {
      display: block;
      font-size: 10px;
      color: var(--text3);
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }
    .settings-body input[type="password"],
    .settings-body input[type="text"] {
      width: 100%;
      font-family: var(--font);
      font-size: 12px;
      padding: 6px 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      outline: none;
      box-sizing: border-box;
    }
    .settings-body input[type="password"]:focus,
    .settings-body input[type="text"]:focus { border-color: var(--green); }

    .api-key-row {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-bottom: 6px;
    }
    .api-key-row input { flex: 1; }

    .api-key-status {
      font-size: 10px;
      padding: 4px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
      transition: opacity 0.3s;
    }
    .api-key-status.saved {
      color: var(--green-light);
      background: rgba(29,158,117,0.1);
      border: 1px solid rgba(29,158,117,0.2);
    }
    .api-key-status.active {
      color: var(--green-light);
      background: rgba(29,158,117,0.08);
      border: 1px solid rgba(29,158,117,0.15);
    }
    .api-key-status.empty {
      color: var(--text3);
      background: var(--surface2);
      border: 1px solid var(--border);
    }
    .api-key-status.error {
      color: var(--red);
      background: var(--red-dim);
      border: 1px solid rgba(232,83,83,0.15);
    }

    .btn-sm {
      font-family: var(--font);
      font-size: 10px;
      padding: 5px 8px;
      border-radius: 5px;
      cursor: pointer;
      letter-spacing: 0.03em;
      transition: background 0.15s, opacity 0.15s;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text3);
      white-space: nowrap;
    }
    .btn-sm:hover { background: var(--glass); color: var(--text2); }
    .btn-sm.danger { background: var(--red-dim); color: var(--red); border-color: rgba(232,83,83,0.15); }
    .btn-sm.danger:hover { background: rgba(232,83,83,0.35); }

    .btn-danger {
      font-family: var(--font);
      font-size: 11px;
      padding: 5px 12px;
      background: var(--red-dim);
      color: var(--red);
      border: 1px solid rgba(232,83,83,0.15);
      border-radius: 6px;
      cursor: pointer;
      letter-spacing: 0.03em;
      transition: background 0.15s;
    }
    .btn-danger:hover { background: rgba(232,83,83,0.35); }

    /* AI reasoning log */
    .ai-log {
      margin-top: 8px;
      max-height: 120px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border2) transparent;
    }
    .ai-log-entry {
      font-size: 9px;
      color: var(--text3);
      padding: 2px 0;
      line-height: 1.4;
      border-left: 2px solid var(--border);
      padding-left: 6px;
      margin-bottom: 3px;
      opacity: 0;
      animation: fadeInLog 0.3s ease forwards;
    }
    .ai-log-entry.thinking { border-left-color: var(--purple); }
    .ai-log-entry.success { border-left-color: var(--green); }
    .ai-log-entry.error { border-left-color: var(--red); }
    .ai-log-entry .log-time { color: var(--text3); opacity: 0.5; margin-right: 4px; }
    @keyframes fadeInLog { to { opacity: 1; } }

    .settings-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
<div class="app">
  <!-- ─── Left: AI & Identity ─── -->
  <aside class="ai-panel">
    <div class="ai-header">Intelligence</div>
    
    <div class="identity-card">
      <div class="identity-text" id="identity-text">Analyzing form...</div>
    </div>

    <!-- AI Settings (Moved from right panel) -->
    <div class="settings-section" style="margin-top:auto; padding-top: 20px; border-top: 1px solid var(--border)">
      <div class="settings-header" style="font-weight:bold; margin-bottom:10px;">AI Settings</div>
      <div class="settings-body" id="settings-body">
        <label>API Key (Anthropic or OpenAI)</label>
        <div class="api-key-row">
          <input type="password" id="api-key-input" placeholder="sk-ant-... (press Enter to save)" />
          <button class="btn-sm danger" id="remove-key-btn" style="display:none">✕</button>
        </div>
        <div class="api-key-status empty" id="api-key-status">No key set — using local drills</div>

        <label style="margin-top:8px">API Mode</label>
        <select id="api-mode-select" style="background:var(--bg); color:var(--text); border:1px solid var(--border); padding:4px; width:100%; margin-bottom:10px;">
          <option value="auto">Auto (Uses API)</option>
          <option value="manual">Manual (Local Fallback)</option>
        </select>

        <label>AI Processing Log</label>
        <div class="ai-log" id="ai-log" style="height:250px"></div>

        <div class="settings-actions" style="margin-top:20px;">
          <button class="btn-danger" id="clear-data-btn">Clear all data</button>
        </div>
      </div>
    </div>
  </aside>

  <!-- ─── Center: Typing ─── -->
  <main class="typing-panel" id="typing-panel">
    <div class="typing-header">
      <span class="title">Cadence</span>
      <button class="mode-toggle primary-mode" id="main-mode-toggle">quote</button>
      <button class="mode-toggle" id="chunk-toggle" title="Track B: Chunking Expansion">chunk</button>
      <button class="mode-toggle" id="transfer-toggle" title="Weekly Transfer Test">transfer</button>
    </div>
    <div class="typing-content">
      <div class="wpm-display" id="wpm-display">—</div>
      <div class="text-display" id="text-display"></div>
      <div class="text-attribution" id="text-attr"></div>
    </div>
    <div class="session-flash" id="session-flash"></div>
    <div class="chunk-nudge" id="chunk-nudge">catch up — read ahead ▸</div>
    <div class="loading-indicator" id="loading-indicator">generating drill</div>
    <div class="focus-overlay" id="focus-overlay">click to focus</div>
    <textarea id="hidden-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
  </main>

  <!-- ─── Right: Metrics ─── -->
  <aside class="metrics-panel">
    <div class="metrics-header">Metrics</div>

    <div class="stat-cards">
      <div class="stat-card">
        <span class="stat-label">Avg Dwell</span>
        <span class="stat-value" id="avg-dwell">—<span class="stat-unit"> ms</span></span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Avg Flight</span>
        <span class="stat-value" id="avg-flight">—<span class="stat-unit"> ms</span></span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Consistency</span>
        <span class="stat-value" id="consistency">—<span class="stat-unit">%</span></span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Keystrokes</span>
        <span class="stat-value" id="ks-count">0</span>
      </div>
    </div>

    <div class="section">
      <div class="section-label">WPM over time</div>
      <div class="wpm-chart-wrap"><canvas id="wpm-canvas"></canvas></div>
    </div>

    <div class="section">
      <div class="section-label">Per-key timing</div>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:var(--green-light)"></div>Dwell</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--purple)"></div>Flight</div>
      </div>
      <div class="vis-row" id="vis"></div>
    </div>

    <div class="section">
      <div class="section-label">Weak digraphs</div>
      <div id="weak-digraphs"></div>
    </div>

    <div class="section">
      <div class="section-label">Digraph heatmap</div>
      <div class="heatmap-container" id="heatmap-container">
        <div class="heatmap-grid" id="heatmap-grid"></div>
        <div class="hm-tooltip" id="hm-tooltip"></div>
      </div>
    </div>

  </aside>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// ─── CONSTANTS ────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════
const WINDOW_MS = 5000;
const CHARS_PER_WORD = 5;
const DRILL_EVERY_N = 5;       // every Nth text is a drill (if weak digraphs exist)
const WEAK_LIST_SIZE = 8;
const MIN_SAMPLES = 5;         // min observations before a digraph counts as "weak"
const LETTERS = 'abcdefghijklmnopqrstuvwxyz';

const SKIP_KEYS = new Set([
  'Backspace','Shift','Control','Alt','Meta','CapsLock','Tab',
  'Enter','ArrowLeft','ArrowRight','ArrowUp','ArrowDown',
  'Escape','Delete','Home','End','PageUp','PageDown',
  'Insert','F1','F2','F3','F4','F5','F6','F7','F8','F9','F10','F11','F12'
]);

// ═══════════════════════════════════════════════════════════════
// ─── QUOTE CORPUS ─────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════
const QUOTES = [
  // Short (≈40–70 chars)
  { text: "Not all those who wander are lost.", attr: "J.R.R. Tolkien" },
  { text: "So it goes.", attr: "Kurt Vonnegut" },
  { text: "Stay hungry, stay foolish.", attr: "Stewart Brand" },
  { text: "We are all made of stars.", attr: "Moby" },
  { text: "Do what you can, with what you have, where you are.", attr: "Theodore Roosevelt" },

// ─── PURE LOGIC: DigraphMap ───────────────────────────────────
// ═══════════════════════════════════════════════════════════════
function buildDigraphKey(prev, cur) {
  if (prev == null || cur == null) return null;
  return (prev + cur).toLowerCase();
}

class DigraphMap {
  constructor(data = {}) {
    // data: { "th": { count, mean, m2 }, ... }  (Welford's)
    this._map = {};
    for (const [k, v] of Object.entries(data)) {
      this._map[k] = { count: v.count, mean: v.mean, m2: v.m2 || 0 };
    }
  }

  update(digraphKey, flightMs) {
    if (!digraphKey || flightMs == null || flightMs < 0 || flightMs > 3000) return;
    let s = this._map[digraphKey];
    if (!s) {
      s = { count: 0, mean: 0, m2: 0 };
      this._map[digraphKey] = s;
    }
    // Welford's online algorithm
    s.count++;
    const delta = flightMs - s.mean;
    s.mean += delta / s.count;
    const delta2 = flightMs - s.mean;
    s.m2 += delta * delta2;
  }

  getStats(digraphKey) {
    const s = this._map[digraphKey];
    if (!s || s.count === 0) return null;
    const variance = s.count > 1 ? s.m2 / (s.count - 1) : 0;
    return {
      count: s.count,
      mean: s.mean,
      stddev: Math.sqrt(variance),
    };
  }

  getWeakList(n = WEAK_LIST_SIZE) {
    return Object.entries(this._map)
      .filter(([_, s]) => s.count >= MIN_SAMPLES)
      .sort((a, b) => b[1].mean - a[1].mean)  // slowest first
      .slice(0, n)
      .map(([key, s]) => ({
        digraph: key,
        mean: s.mean,
        count: s.count,
        stddev: s.count > 1 ? Math.sqrt(s.m2 / (s.count - 1)) : 0,
      }));
  }

  getOverallMean() {
    const entries = Object.values(this._map).filter(s => s.count >= MIN_SAMPLES);
    if (entries.length === 0) return 0;
    const totalWeighted = entries.reduce((a, s) => a + s.mean * s.count, 0);
    const totalCount = entries.reduce((a, s) => a + s.count, 0);
    return totalWeighted / totalCount;
  }

  toHeatmapData() {
    const result = [];
    for (let i = 0; i < 26; i++) {
      for (let j = 0; j < 26; j++) {
        const key = LETTERS[i] + LETTERS[j];
        const s = this._map[key];
        result.push({
          from: LETTERS[i],
          to: LETTERS[j],
          key,
          count: s ? s.count : 0,
          mean: s ? s.mean : 0,
        });
      }
    }
    return result;
  }

  toJSON() {
    const out = {};
    for (const [k, v] of Object.entries(this._map)) {
      out[k] = { count: v.count, mean: v.mean, m2: v.m2 };
    }
    return out;
  }
}

// ═══════════════════════════════════════════════════════════════
// ─── PURE LOGIC: Rolling WPM ─────────────────────────────────
// ═══════════════════════════════════════════════════════════════
function getRollingWpm(timestamps, now) {
  now = now || performance.now();
  const windowed = timestamps.filter(t => t >= now - WINDOW_MS);
  if (windowed.length < 2) return 0;
  const span = (now - windowed[0]) / 60000;
  if (span <= 0) return 0;
  return Math.round((windowed.length / CHARS_PER_WORD) / span);
}

// ═══════════════════════════════════════════════════════════════
// ─── PURE LOGIC: Consistency ──────────────────────────────────
// ═══════════════════════════════════════════════════════════════
function computeConsistency(dwells) {
  if (dwells.length < 2) return 0;
  const mean = dwells.reduce((a, b) => a + b, 0) / dwells.length;
  if (mean === 0) return 0;
  const variance = dwells.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / dwells.length;
  const cv = Math.sqrt(variance) / mean;
  return Math.max(0, Math.min(100, Math.round((1 - cv) * 100)));
}

// ═══════════════════════════════════════════════════════════════
// ─── PURE LOGIC: Chunk Horizon Estimator ──────────────────────
// ═══════════════════════════════════════════════════════════════
function estimateChunkHorizon(events) {
  // events: [{ key, flight }]
  const interWord = [];  // flights after space (inter-word)
  const intraWord = [];  // flights within words

  for (let i = 1; i < events.length; i++) {
    const flight = events[i].flight;
    if (flight == null || flight < 0 || flight > 2000) continue;
    if (events[i - 1].key === ' ') {
      interWord.push(flight);
    } else if (events[i].key !== ' ') {
      intraWord.push(flight);
    }
  }

  if (intraWord.length < 5 || interWord.length < 3) return 1.5;

  const avgInter = interWord.reduce((a, b) => a + b, 0) / interWord.length;
  const avgIntra = intraWord.reduce((a, b) => a + b, 0) / intraWord.length;

  if (avgIntra === 0) return 1.0;
  const ratio = avgIntra / avgInter; // closer to 1.0 = deeper buffer
  const horizon = 1.0 + ratio * 3.0;
  return Math.max(1.0, Math.min(4.0, Math.round(horizon * 10) / 10));
}

// ─── PURE LOGIC: Drill Text Generator ─────────────────────────
// ═══════════════════════════════════════════════════════════════
function generateDrillText(weakDigraphs, wordCount = 22) {
  if (!weakDigraphs || weakDigraphs.length === 0) return null;
  const targetSet = new Set(weakDigraphs.map(w => w.digraph || w));

  // Score words by how many target digraphs they contain
  const scored = WORDS.map(word => {
    let score = 0;
    const lower = word.toLowerCase();
    for (const dg of targetSet) {
      if (lower.includes(dg)) score += 2;
    }
    return { word, score };
  }).filter(w => w.score > 0);

  if (scored.length === 0) return null;

  // Weighted random selection
  const result = [];
  let lastWord = '';
  for (let i = 0; i < wordCount; i++) {
    // Prefer higher-scored words
    const pool = scored.filter(w => w.word !== lastWord);
    if (pool.length === 0) break;
    const totalScore = pool.reduce((a, w) => a + w.score, 0);
    let pick = Math.random() * totalScore;
    let chosen = pool[0];
    for (const w of pool) {
      pick -= w.score;
      if (pick <= 0) { chosen = w; break; }
    }
    result.push(chosen.word);
    lastWord = chosen.word;
  }

  return result.join(' ');
}

function shuffleQuotes() {
  quoteOrder = QUOTES.map((_, i) => i);
  for (let i = quoteOrder.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [quoteOrder[i], quoteOrder[j]] = [quoteOrder[j], quoteOrder[i]];
  }
  quoteIndex = 0;
}

async function loadNextText() {
  textsTyped++;
  profile.textCount = (profile.textCount || 0) + 1;

  stopChunkTimer();

  const weakList = digraphMap.getWeakList();
  
  // Practice Mode explicitly forces drills
  if (appMode === 'practice' && !isTransfer) {
    $loadingIndicator.classList.add('visible');
    const drillText = await generateDrillTextWithCache(weakList);
    $loadingIndicator.classList.remove('visible');
    
    if (drillText) {
      currentText = drillText;
      currentAttr = '';
      renderText();
      return;
    }
  }

  // Quote / Transfer Mode
  isTransfer = false;

  if (quoteIndex >= quoteOrder.length) shuffleQuotes();
  const quote = QUOTES[quoteOrder[quoteIndex++]];
  currentText = quote.text;
  currentAttr = quote.attr;
  renderText();
  if (chunkMode) startChunkTimer();
}

function renderText() {
  cursorPos = 0;
  sessionStartTime = 0;
  sessionErrors = 0;
  prevCharKey = null;
  chunkTargetPos = 0;

  let html = '';
  for (let i = 0; i < currentText.length; i++) {
    const ch = currentText[i];
    const display = ch === ' ' ? ' ' : ch;
    const cls = i === 0 ? 'char char-current' : 'char char-pending';
    html += `<span class="${cls}" data-i="${i}">${display}</span>`;
  }
  $text.innerHTML = html;
  $attr.textContent = currentAttr ? `— ${currentAttr}` : '';
}

function handleCharInput(typedChar) {
  if (cursorPos >= currentText.length) return;
  if (sessionStartTime === 0) sessionStartTime = performance.now();

  const expected = currentText[cursorPos];

  if (typedChar === expected) {
    // Correct
    const span = $text.querySelector(`[data-i="${cursorPos}"]`);
    if (span) {
      span.className = 'char char-correct';
    }
    cursorPos++;

    // Mark next char as current
    if (cursorPos < currentText.length) {
      const next = $text.querySelector(`[data-i="${cursorPos}"]`);
      if (next) next.className = 'char char-current';
    }

    // Update chunk zone highlighting
    if (chunkMode) updateChunkZone();

    // Check completion
    if (cursorPos >= currentText.length) {
      onTextComplete();
    }
  } else {
    // Incorrect — shake the current char
    sessionErrors++;
    const span = $text.querySelector(`[data-i="${cursorPos}"]`);
    if (span) {
      span.className = 'char char-shake';
      setTimeout(() => {
        if (cursorPos < currentText.length) {
          const s = $text.querySelector(`[data-i="${cursorPos}"]`);
          if (s) s.className = 'char char-current';
        }
      }, 200);
    }
  }
}

function onTextComplete() {
  // Flash
  $flash.classList.add('active');
  setTimeout(() => $flash.classList.remove('active'), 400);
  stopChunkTimer();

  // Compute session stats
  const duration = performance.now() - sessionStartTime;
  const wpm = duration > 0 ? Math.round((currentText.length / CHARS_PER_WORD) / (duration / 60000)) : 0;
  const dwells = events.filter(e => !SKIP_KEYS.has(e.key)).map(e => e.dwell);
  const consistency = computeConsistency(dwells);

  // Update profile
  profile.digraphStats = digraphMap.toJSON();

  // Divergence Detection
  if (isTransfer && wpm > 0) {
    profile.transferHistory.push({ date: Date.now(), wpm, consistency });
    let trackC = profile.sessions.filter(s => s.track === 'C' || s.track === 'quote');
    trackC = trackC.slice(-10);
    if (trackC.length >= 2) {
      const avgTrain = trackC.reduce((a, s) => a + s.wpm, 0) / trackC.length;
      const lastTwo = profile.transferHistory.slice(-2);
      if (lastTwo.length === 2 && lastTwo.every(t => t.wpm < avgTrain * 0.9)) {
        aiLog(`⚠️ Transfer WPM diverged <90% of training avg for 2 tests. Focus on accuracy over burst speed.`, 'error');
      }
    }
  }

  // Append session
  const isDrill = (appMode === 'practice');
  const trackLabel = isTransfer ? 'transfer' : (chunkMode ? 'B' : (isDrill ? 'A' : 'C'));
  Profile.appendSession(profile, { timestamp: Date.now(), track: trackLabel, wpm, consistency });

  updateIdentityUI();
  updateMetrics();
  loadNextText();
}

// ═══════════════════════════════════════════════════════════════
// ─── TRACK B: CHUNKING EXPANSION ─────────────────────────────
// ═══════════════════════════════════════════════════════════════
let chunkFellBehind = false;

function startChunkTimer() {
  chunkTargetPos = 0;
  chunkFellBehind = false;
  $chunkNudge.classList.remove('visible');

  // Compute advance rate based on user's recent WPM
  const recentSessions = profile.sessions.slice(-5);
  const avgWpm = recentSessions.length > 0
    ? recentSessions.reduce((a, s) => a + s.wpm, 0) / recentSessions.length
    : 60;
  // chars per second at target WPM
  const cps = (avgWpm * CHARS_PER_WORD) / 60;
  const intervalMs = 100;
  const charsPerTick = cps * (intervalMs / 1000);

  chunkTimerId = setInterval(() => {
    if (sessionStartTime === 0) return; // haven't started typing yet
    chunkTargetPos = Math.min(currentText.length, chunkTargetPos + charsPerTick);
    updateChunkZone();

    // Check if user fell behind (cursor > 2 words behind target)
    const wordsBehind = countWordsBetween(currentText, cursorPos, Math.floor(chunkTargetPos));
    if (wordsBehind > 2) {
      $chunkNudge.classList.add('visible');
      chunkFellBehind = true;
    } else {
      $chunkNudge.classList.remove('visible');
    }
  }, intervalMs);
}

function stopChunkTimer() {
  if (chunkTimerId) {
    clearInterval(chunkTimerId);
    chunkTimerId = null;
  }
  $chunkNudge.classList.remove('visible');
}

function updateChunkZone() {
  if (!chunkMode) return;
  const horizonChars = Math.floor(profile.chunkHorizon * 5); // approx chars for N words
  const zoneEnd = Math.min(currentText.length, cursorPos + horizonChars);

  for (let i = cursorPos + 1; i < currentText.length; i++) {
    const span = $text.querySelector(`[data-i="${i}"]`);
    if (!span) continue;
    if (span.classList.contains('char-correct')) continue;
    if (i <= zoneEnd) {
      span.className = 'char char-chunk-zone';
    } else {
      span.className = 'char char-pending';
    }
  }
}

function countWordsBetween(text, posA, posB) {
  if (posA >= posB) return 0;
  const slice = text.slice(posA, posB);
  return slice.split(/\s+/).filter(Boolean).length;
}

// ═══════════════════════════════════════════════════════════════
// ─── AI CACHE ────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════
function computeWeakHash(weakList) {
  return weakList.map(w => w.digraph || w).sort().join(',');
}

async function generateDrillTextWithCache(weakList) {
  const hash = computeWeakHash(weakList);
  const cache = profile.aiCache;

  // Cache hit: same weak list, texts available
  if (cache.hash === hash && cache.texts.length > 0) {
    aiLog('Using cached drill text', 'success');
    const text = cache.texts.pop();
    Profile.save(profile);
    return text;
  }

  // Cache miss: generate fresh
  const text = await generateDrillTextAsync(weakList);

  // Update cache hash
  cache.hash = hash;
  // Don't cache the text we're about to use, but pre-generate extras in background
  Profile.save(profile);

  return text;
}

$input.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  if (!keyDownTimes[e.key]) {
    keyDownTimes[e.key] = performance.now();
  }
});

$input.addEventListener('keyup', (e) => {
  const now = performance.now();
  const downTime = keyDownTimes[e.key];
  if (downTime === undefined) return;

  const dwell = now - downTime;
  const flight = lastKeyUpTime !== null ? (downTime - lastKeyUpTime) : null;
  delete keyDownTimes[e.key];
  lastKeyUpTime = now;

  // Record event
  const evt = { key: e.key, dwell, flight, timestamp: downTime };
  events.push(evt);

  if (!SKIP_KEYS.has(e.key)) {
    keystrokeTimestamps.push(downTime);

    // Digraph tracking
    const charKey = e.key.length === 1 ? e.key : null;
    if (charKey && prevCharKey) {
      const dgKey = buildDigraphKey(prevCharKey, charKey);
      if (dgKey && flight != null) {
        digraphMap.update(dgKey, flight);
      }
    }
    if (charKey) prevCharKey = charKey;
    else if (e.key === 'Backspace') prevCharKey = null; // break chain on backspace
  }

  updateMetrics();
});

// Handle actual text input
$input.addEventListener('input', (e) => {
  const data = e.data;
  if (data && data.length > 0) {
    handleCharInput(data[data.length - 1]); // last char of input data
  }
  // Clear textarea to keep it clean
  $input.value = '?';
});

// Handle backspace via beforeinput
$input.addEventListener('beforeinput', (e) => {
  if (e.inputType === 'deleteContentBackward' || e.inputType === 'deleteWordBackward') {
    // Don't allow going back in stop-on-error mode
    e.preventDefault();
  }
});

function updateMetrics() {
  const typed = events.filter(e => !SKIP_KEYS.has(e.key));
  const dwells = typed.map(e => e.dwell);
  const flights = typed.map(e => e.flight).filter(v => v != null && v >= 0 && v < 2000);

  $ksCount.textContent = typed.length;

  if (dwells.length >= 2) {
    const avg = dwells.reduce((a, b) => a + b, 0) / dwells.length;
    $avgDwell.innerHTML = Math.round(avg) + '<span class="stat-unit"> ms</span>';
    const c = computeConsistency(dwells);
    $consistency.innerHTML = c + '<span class="stat-unit">%</span>';
  }

  if (flights.length >= 1) {
    const avg = flights.reduce((a, b) => a + b, 0) / flights.length;
    $avgFlight.innerHTML = Math.round(avg) + '<span class="stat-unit"> ms</span>';
  }

  renderKeyBars(typed);
  renderWeakDigraphs();
  updateHeatmap();
}

function renderKeyBars(typed) {
  const recent = typed.slice(-20);
  if (!recent.length) { $vis.innerHTML = ''; return; }

  const maxVal = Math.max(
    ...recent.map(e => e.dwell || 0),
    ...recent.map(e => (e.flight != null && e.flight >= 0 && e.flight < 2000) ? e.flight : 0),
    10
  );

  $vis.innerHTML = recent.map(e => {
    const dh = Math.max(1, Math.round(((e.dwell || 0) / maxVal) * 48));
    const validFlight = e.flight != null && e.flight >= 0 && e.flight < 2000;
    const fh = validFlight ? Math.max(1, Math.round((e.flight / maxVal) * 48)) : 0;
    const label = e.key === ' ' ? '·' : e.key.length === 1 ? e.key : '?';
    return `<div class="bar-group">
      <div class="bar bar-flight" style="height:${fh}px"></div>
      <div class="bar bar-dwell" style="height:${dh}px"></div>
      <div class="bar-key">${label}</div>
    </div>`;
  }).join('');
}

// ─── WPM Chart ───
function drawWpmChart() {
  const dpr = window.devicePixelRatio || 1;
  const w = $wpmCanvas.parentElement.clientWidth || 260;
  const h = 50;
  $wpmCanvas.width = w * dpr;
  $wpmCanvas.height = h * dpr;
  $wpmCanvas.style.width = w + 'px';
  $wpmCanvas.style.height = h + 'px';
  wpmCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  wpmCtx.clearRect(0, 0, w, h);
  if (wpmHistory.length < 2) return;

  const maxWpm = Math.max(...wpmHistory, 20);
  const pts = wpmHistory.map((wpm, i) => ({
    x: (i / (wpmHistory.length - 1)) * w,
    y: h - 4 - ((wpm / maxWpm) * (h - 12))
  }));

  wpmCtx.beginPath();
  wpmCtx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) {
    const cp = (pts[i].x + pts[i - 1].x) / 2;
    wpmCtx.bezierCurveTo(cp, pts[i - 1].y, cp, pts[i].y, pts[i].x, pts[i].y);
  }
  wpmCtx.strokeStyle = '#1D9E75';
  wpmCtx.lineWidth = 1.5;
  wpmCtx.stroke();

  wpmCtx.lineTo(pts[pts.length - 1].x, h);
  wpmCtx.lineTo(pts[0].x, h);
  wpmCtx.closePath();
  wpmCtx.fillStyle = 'rgba(29,158,117,0.08)';
  wpmCtx.fill();

  wpmCtx.font = '9px monospace';
  wpmCtx.fillStyle = 'rgba(100,100,100,0.5)';
  wpmCtx.textAlign = 'right';
  wpmCtx.fillText(maxWpm + '', w - 2, 9);
}

// ─── Heatmap ───
let hmCells = {};

function buildHeatmap() {
  let html = '<div class="hm-corner hm-header"></div>';
  for (let j = 0; j < 26; j++) {
    html += `<div class="hm-header">${LETTERS[j]}</div>`;
  }
  for (let i = 0; i < 26; i++) {
    html += `<div class="hm-header">${LETTERS[i]}</div>`;
    for (let j = 0; j < 26; j++) {
      const key = LETTERS[i] + LETTERS[j];
      html += `<div class="hm-cell" data-dg="${key}" id="hm-${key}"></div>`;
    }
  }
  $hmGrid.innerHTML = html;

  // Cache cell references
  for (let i = 0; i < 26; i++) {
    for (let j = 0; j < 26; j++) {
      const key = LETTERS[i] + LETTERS[j];
      hmCells[key] = document.getElementById('hm-' + key);
    }
  }

  // Hover
  $hmGrid.addEventListener('mouseover', (e) => {
    const dg = e.target.dataset?.dg;
    if (!dg) { $hmTooltip.classList.remove('visible'); return; }
    const stats = digraphMap.getStats(dg);
    if (!stats || stats.count === 0) {
      $hmTooltip.classList.remove('visible');
      return;
    }
    $hmTooltip.innerHTML = `<strong>${dg}</strong>  ${Math.round(stats.mean)} ms · ${stats.count} samples`;
    const rect = e.target.getBoundingClientRect();
    const containerRect = document.getElementById('heatmap-container').getBoundingClientRect();
    $hmTooltip.style.left = (rect.left - containerRect.left + 12) + 'px';
    $hmTooltip.style.top = (rect.top - containerRect.top - 28) + 'px';
    $hmTooltip.classList.add('visible');
  });

  $hmGrid.addEventListener('mouseleave', () => {
    $hmTooltip.classList.remove('visible');
  });
}

function updateHeatmap() {
  const data = digraphMap.toHeatmapData();
  const means = data.filter(d => d.count > 0).map(d => d.mean);
  if (means.length === 0) return;

  const minMean = Math.min(...means);
  const maxMean = Math.max(...means);
  const range = maxMean - minMean || 1;

  for (const d of data) {
    const cell = hmCells[d.key];
    if (!cell) continue;
    if (d.count === 0) {
      cell.style.backgroundColor = '';
      continue;
    }
    // Normalize 0 (fast/green) to 1 (slow/red)
    const t = (d.mean - minMean) / range;
    const r = Math.round(30 + t * 200);
    const g = Math.round(160 - t * 120);
    const b = Math.round(120 - t * 80);
    const alpha = Math.min(0.9, 0.3 + (d.count / 30) * 0.6);
    cell.style.backgroundColor = `rgba(${r},${g},${b},${alpha})`;
  }
}

async function callAnthropic(apiKey, dgList) {
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: 'claude-3-haiku-20240307',
      max_tokens: 60,
      messages: [{ role: 'user', content: buildTersePrompt(dgList) }],
    }),
  });
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  const data = await resp.json();
  return data.content?.[0]?.text || null;
}

async function callOpenAI(apiKey, dgList) {
  const resp = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${apiKey}`,
    },
    body: JSON.stringify({
      model: 'gpt-4o-mini',
      max_tokens: 60,
      messages: [
        { role: 'user', content: buildTersePrompt(dgList) },
      ],
    }),
  });
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  const data = await resp.json();
  return data.choices?.[0]?.message?.content || null;
}

async function generateAIText(weakDigraphs) {
  const apiKey = profile.apiKey;
  const hash = computeWeakHash(weakDigraphs);
  const hasCacheHit = profile.aiCache.hash === hash && profile.aiCache.texts.length > 0;
  
  if (!shouldUseAPI(profile.apiMode, hasCacheHit, !!apiKey)) {
    return null; // Fall back to local solver (or cache, which is handled upstream)
  }

  const provider = detectProvider(apiKey);
  if (provider === 'unknown') {
    aiLog('Unrecognized key format — expected sk-ant-... or sk-...', 'error');
    return null;
  }

  const dgList = weakDigraphs.map(w => w.digraph || w).join(', ');
  const providerLabel = provider === 'anthropic' ? 'Claude (Haiku)' : 'GPT-4o-mini';
  aiLog(`Calling ${providerLabel} — targeting: ${dgList}`, 'thinking');
  $loadingIndicator.classList.add('visible');

  const t0 = performance.now();
  try {
    const text = provider === 'anthropic'
      ? await callAnthropic(apiKey, dgList)
      : await callOpenAI(apiKey, dgList);

    const latency = Math.round(performance.now() - t0);

    if (text && text.length > 10) {
      aiLog(`✓ ${providerLabel} returned ${text.split(' ').length} words (${latency}ms)`, 'success');
      return text.trim();
    }
    aiLog(`Response too short (${latency}ms), falling back to local`, 'error');
    return null;
  } catch (err) {
    const latency = Math.round(performance.now() - t0);
    if (err instanceof TypeError && err.message.includes('Failed to fetch')) {
      aiLog(`CORS blocked (${latency}ms) — browser security prevents direct API calls from file://. Serve via localhost.`, 'error');
    } else {
      aiLog(`${providerLabel} error (${latency}ms): ${err.message}`, 'error');
    }
    return null;
  } finally {
    $loadingIndicator.classList.remove('visible');
  }
}

// Override drill generation to try API first
const _origGenerateDrill = generateDrillText;
async function generateDrillTextAsync(weakList) {
  const aiText = await generateAIText(weakList);
  if (aiText) return aiText;
  aiLog('Using local word list fallback', 'thinking');
  return _origGenerateDrill(weakList);
}

// ═══════════════════════════════════════════════════════════════
// ─── TICK LOOP (1s interval) ──────────────────────────────────
// ═══════════════════════════════════════════════════════════════
setInterval(() => {
  const wpm = getRollingWpm(keystrokeTimestamps);
  $wpm.textContent = wpm > 0 ? wpm : '—';
  wpmHistory.push(wpm);
  if (wpmHistory.length > 60) wpmHistory.shift();
  drawWpmChart();
}, 1000);

// ═══════════════════════════════════════════════════════════════
// ─── INIT ────────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════
function init() {
  shuffleQuotes();
  buildHeatmap();
  updateUIVisibility();
  updateIdentityUI();
  $input.value = '?';

  // Restore digraph data from profile to heatmap
  if (Object.keys(profile.digraphStats).length > 0) {
    updateHeatmap();
    renderWeakDigraphs();
  }

  loadNextText();
  $input.focus();
}

init();
</script>
